name: PostgreSQL Warehouse CI

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  postgres-warehouse:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: retail360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download AdventureWorksDW source files
        run: python scripts/download_adventureworks.py

      - name: Validate source integrity
        run: python scripts/validate_source_integrity.py

      - name: Load PostgreSQL raw warehouse
        run: python scripts/load_postgres_raw.py

      - name: Reconcile PostgreSQL row counts
        run: python scripts/qa_postgres_raw.py

      - name: Apply Stage 3 staging transformations
        run: python scripts/apply_staging.py

      - name: Validate Stage 3 staging layer
        run: python scripts/qa_staging.py

      - name: Build Stage 4 analytics star schema
        run: python scripts/build_analytics.py

      - name: Validate Stage 4 analytics star schema
        run: python scripts/qa_analytics.py

      - name: Validate Stage 5 semantic-model contract
        run: python scripts/validate_semantic_model.py
