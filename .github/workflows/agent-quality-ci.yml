name: Agent Quality CI

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "agent/**"
      - "tests/agent/**"
      - "docs/agent/**"
      - "powerbi/semantic-model-contract.json"
      - "docs/powerbi/kpi-dictionary.md"
      - "requirements.txt"
      - ".github/workflows/agent-quality-ci.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "agent/**"
      - "tests/agent/**"
      - "powerbi/semantic-model-contract.json"
      - "docs/powerbi/kpi-dictionary.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install agent test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile agent package
        run: python -m compileall -q agent

      - name: Run agent unit, guardrail and workflow tests
        run: pytest -q tests/agent

      - name: Run deterministic benchmark
        run: python -m agent.evaluation.evaluate > agent-evaluation.json

      - name: Enforce benchmark quality gate
        run: python scripts/validate_agent_evaluation.py agent-evaluation.json

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail360-agent-evaluation
          path: agent-evaluation.json
          if-no-files-found: warn
          retention-days: 14
